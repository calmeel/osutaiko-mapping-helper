<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">終点の有効化を使った相対速度変化の加算イメージ</title>
  <desc id="desc">加算の入力値が始点の -0.0 から終点の -1.0 へ変化し、変化後の SV が徐々に下へ離れる様子。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#24c467"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", sans-serif; fill: #d8e3f2; font-size: 17px; }
    .caption { font-size: 15px; fill: #93a8bf; }
    .formula { font-size: 18px; font-weight: 700; fill: #f8fbff; }
    .axis { stroke: #53667f; stroke-width: 2; }
    .before { stroke: #ff4d57; stroke-width: 4; fill: none; stroke-linecap: round; }
    .after { stroke: #24c467; stroke-width: 4; fill: none; stroke-linecap: round; }
    .delta { stroke: #24c467; stroke-width: 3.2; marker-end: url(#arrow); }
    .label-before { fill: #ff6b73; font-weight: 700; }
    .label-after { fill: #39d47d; font-weight: 700; }
    .label-delta { fill: #24c467; font-weight: 700; }
  </style>
  <rect width="720" height="360" rx="10" fill="#0b1017"/>
  <rect x="20" y="18" width="680" height="324" rx="8" fill="#101823" stroke="#28374a"/>
  <text class="formula" x="42" y="52">End Timing enabled example: Add value from -0.0 to -1.0</text>
  <line class="axis" x1="48" y1="276" x2="675" y2="276"/>
  <line class="axis" x1="48" y1="296" x2="48" y2="82"/>
  <text class="caption" x="640" y="304">Timing</text>
  <text class="caption" x="24" y="94">SV</text>
  <path class="before" d="M70 148 L190 168 L260 130 L385 156 L470 118 L650 150"/>
  <path class="after" d="M70 148 L190 186 L260 166 L385 216 L470 200 L650 250"/>
  <line class="delta" x1="625" y1="145" x2="625" y2="242"/>
  <text class="label-delta" x="50" y="172">- 0.0</text>
  <text class="label-delta" x="580" y="202">- 1.0</text>
  <text class="label-before" x="466" y="99">SV before change</text>
  <text class="label-after" x="446" y="250">SV after change</text>
</svg>
