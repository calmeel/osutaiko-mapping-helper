<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" role="img" aria-labelledby="title desc">
  <title id="title">上昇する SV 変化</title>
  <desc id="desc">横軸が Timing、縦軸が SV。等差は上昇する直線、等比は上昇する曲線として描かれている。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", sans-serif; fill: #cbd7e6; font-size: 14px; }
    .axis { stroke: #53667f; stroke-width: 2; }
    .linear { stroke: #35e3d2; stroke-width: 3.5; fill: none; stroke-linecap: round; }
    .geometric { stroke: #ffbd73; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-dasharray: 7 6; }
    .point { fill: #f8fbff; stroke: #35e3d2; stroke-width: 2; }
    .legend { font-weight: 700; }
    .legend-linear { fill: #35e3d2; }
    .legend-geometric { fill: #ffbd73; }
  </style>
  <rect width="360" height="150" rx="8" fill="#0b1017"/>
  <line class="axis" x1="36" y1="118" x2="330" y2="118"/>
  <line class="axis" x1="36" y1="118" x2="36" y2="22"/>
  <text x="300" y="140">Timing</text>
  <text x="8" y="30">SV</text>
  <line class="linear" x1="48" y1="108" x2="310" y2="26"/>
  <path class="geometric" d="M48 108 C112 104, 184 86, 238 58 C272 40, 292 30, 310 26"/>
  <circle class="point" cx="48" cy="108" r="3.2"/>
  <circle class="point" cx="310" cy="26" r="3.2"/>
  <text class="legend legend-linear" x="62" y="54">等差</text>
  <text class="legend legend-geometric" x="222" y="96">等比</text>
</svg>
